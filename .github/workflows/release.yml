name: Release
# Pushing a tag such as v0.2.0 builds the installers and drafts a release holding them and
# SHA256SUMS.txt. Run by hand, it builds and checksums the installers without drafting anything.
# Either way each installer gets a signed build provenance attestation, which `gh attestation
# verify` checks against this repository and workflow.
# Actions are pinned to commit SHAs, since a tag can be moved; Dependabot keeps them current.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Check the tag matches the version in package.json
        if: github.ref_type == 'tag'
        run: |
          version="v$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "The tag is $GITHUB_REF_NAME but package.json says $version." >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run dist -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers-${{ matrix.os }}
          path: |
            release/*.AppImage
            release/*.dmg
            release/*.exe
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # For the attestation: a token to sign with, and the right to store the result.
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installers-*
          merge-multiple: true
          path: installers
      - run: sh scripts/checksums.sh installers
      # Attests every installer named in the checksum list, so the two always cover the same files.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: installers/SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checksums
          path: installers/SHA256SUMS.txt
      # A draft: nothing is public until it is published by hand.
      - name: Draft the release
        if: github.ref_type == 'tag'
        run: gh release create "$GITHUB_REF_NAME" installers/* --draft --verify-tag --generate-notes --title "Organtic ${GITHUB_REF_NAME#v}"
        env:
          GH_TOKEN: ${{ github.token }}
